<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signature Required</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="title">Signature Required</div>
        <div id="clock">15:00</div>
        <div id="phase"></div>
        <div id="controls">
          <button id="btn-help" title="How to play">?</button>
          <button id="btn-pause" title="Pause (P or Space)">⏸</button>
          <select id="speed" title="Game speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <button id="btn-new" title="New game">New game</button>
        </div>
      </header>
      <aside id="left" class="side">
        <section class="panel">
          <h2>You</h2>
          <div id="me"></div>
        </section>
        <section class="panel">
          <h2>Other players</h2>
          <div id="players"></div>
        </section>
        <section class="panel">
          <h2>Companies</h2>
          <div id="companies"></div>
        </section>
      </aside>
      <main id="map-wrap">
        <canvas id="map"></canvas>
        <div id="hint"></div>
        <div id="tooltip" hidden></div>
        <div id="toasts"></div>
        <div id="payout"></div>
        <div id="overlay" hidden></div>
      </main>
      <aside id="right" class="side">
        <section class="panel" id="auction-panel">
          <h2>Auction</h2>
          <div id="auction"></div>
          <form id="bid-custom" hidden>
            <button id="bid-down" type="button" title="Down to the previous $5">−5</button>
            <button id="bid-down1" type="button" title="$1 less">−1</button>
            <span class="amount">$<input id="bid-amount" type="number" min="0" step="1" inputmode="numeric" /></span>
            <button id="bid-up1" type="button" title="$1 more">+1</button>
            <button id="bid-up" type="button" title="Up to the next $5">+5</button>
            <button id="bid-go" type="submit">Bid</button>
            <button id="bid-pass" type="button" title="Done bidding (until someone else bids): the auction ends early once everyone but the high bidder has passed">Pass</button>
          </form>
        </section>
        <section class="panel">
          <h2>Your companies</h2>
          <div id="mycos"></div>
        </section>
        <section class="panel">
          <h2>Log</h2>
          <ol id="log"></ol>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
