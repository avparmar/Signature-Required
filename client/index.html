<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signature Required</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="title">Signature Required</div>
        <div id="clock">15:00</div>
        <div id="phase"></div>
        <div id="controls">
          <button id="btn-online" title="Play with friends">Play online</button>
          <button id="btn-settings" title="Settings">⚙</button>
          <button id="btn-help" title="How to play">?</button>
          <button id="btn-pause" title="Pause (P or Space)">⏸</button>
          <select id="speed" title="Game speed">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <button id="btn-new" title="New game">New game</button>
        </div>
      </header>
      <aside id="left" class="side" aria-label="Companies">
        <div id="companies"></div>
      </aside>
      <main id="map-wrap">
        <canvas id="map"></canvas>
        <div id="hint"></div>
        <div id="tooltip" hidden></div>
        <div id="toasts"></div>
        <div id="payout"></div>
        <div id="overlay" hidden></div>
      </main>
      <aside id="right" class="side">
        <section class="panel">
          <h2 id="me-title">You</h2>
          <div id="me"></div>
        </section>
        <section class="panel">
          <h2>Other players</h2>
          <div id="players"></div>
        </section>
        <section class="panel">
          <h2 id="mycos-title">Your companies</h2>
          <div id="mycos"></div>
        </section>
        <section class="panel">
          <h2>Log</h2>
          <ol id="log"></ol>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
